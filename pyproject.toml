[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usdaeco-pipe"
version = "0.2.4"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["usdaeco-toolchain>=0.3.8,<0.4"]

[project.scripts]
aeco-pipe = "usdaeco_pipe.cli:main"

[tool.setuptools]
packages = ["usdaeco_pipe", "usdAecoPipeValidators"]
package-dir = {usdaeco_pipe = "tools/usdaeco_pipe", usdAecoPipeValidators = "usdAecoPipeValidators"}

[tool.setuptools.package-data]
usdAecoPipeValidators = ["plugInfo.json"]

[tool.pytest.ini_options]
testpaths = ["testenv"]
python_files = ["test*.py"]
